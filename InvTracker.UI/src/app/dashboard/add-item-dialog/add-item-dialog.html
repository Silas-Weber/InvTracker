<div class="fixed top-0 z-2 flex bg-[#0F172A]/40 h-full w-full" 
>

  <div class="px-4 pb-4 border-2 rounded-lg border-border-color w-[40%] h-[70%] overflow-scroll bg-[#ffffff] m-auto relative">
    <div class="sticky top-0 z-20 bg-[#ffffff]">
    <div class="flex justify-between  pt-4  left-0  mb-2 mx-auto pb-2 border-b-2  border-border-color bg-[#ffffff]">
      <h2 class="text-3xl font-bold leading-10">Item hinzufügen</h2>
      <button class="inline-flex items-center justify-center h-12 w-12 text-2xl cursor-pointer hover:bg-border-color hover:rounded-full"
      (click)="closeDialog()">X</button>

  

  </div>
    <app-searchbar [placeholderText]="'Item suchen'" [list]='this.itemSerice.allItemsNames()' (addItem)="addItem($event)"></app-searchbar>

</div>
    <form [formRoot]="addForm">

@for (form of addForm; track form; let i = $index) {
  <div class="grid grid-cols-[minmax(8rem,30%)_minmax(0,1fr)_8rem] overflow-hidden relative z-1 grid-rows-[auto_auto] items-stretch gap-2 h-auto mx-auto mb-3 card p-4 bg-[#F4F6F8]">

    <div>
      <div class="card h-full">
        {{ form.name().value() }}
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <div class="flex flex-1 items-center">

        <label class="cursor-pointer inline-flex items-center gap-3">
          stattrack&#8482;
          <input
            type="checkbox"
            class="sr-only peer"
            [formField]="form.stattrak">

          <span class="relative inline-block h-6 w-11 rounded-full bg-[#B9C1C8] peer-checked:bg-profit-color peer-checked:[&>span]:translate-x-5 transition-colors">
            <span class="absolute left-0.75 top-0.75 size-4.5 rounded-full bg-background-white transition-transform"></span>
          </span>
        </label>

        <label class="cursor-pointer inline-flex items-center gap-3 ml-3">
          souvenir
          <input
            type="checkbox"
            class="sr-only peer"
            [formField]="form.souvenir">

          <span class="relative inline-block h-6 w-11 rounded-full bg-[#B9C1C8] peer-checked:bg-profit-color peer-checked:[&>span]:translate-x-5 transition-colors">
            <span class="absolute left-0.75 top-0.75 size-4.5 rounded-full bg-background-white transition-transform"></span>
          </span>
        </label>

      </div>

      <div class="flex flex-1 items-center">
        <label class="w-full">
          <select
            [formField]="form.condition"
            class="border-2 border-border-color p-3 rounded-lg bg-[#ffffff] focus-within:border-[#697482] w-full">
            <option value="" disabled>Zustand auswählen</option>
            <option value="Factory New">Factory New</option>
            <option value="Minimal Wear">Minimal Wear</option>
            <option value="Field-Tested">Field-Tested</option>
            <option value="Well-Worn">Well-Worn</option>
            <option value="Battle-Scarred">Battle-Scarred</option>
          </select>
        </label>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <div
        class="flex flex-1 items-center border-2 bg-[#ffffff] p-3 rounded-lg focus-within:border-[#697482]"
        [class.border-warning-red]="form.quantity().invalid() && form.quantity().touched()"
        [class.border-border-color]="!(form.quantity().invalid() && form.quantity().touched())">
        <input
          class="w-full outline-none"
          type="text"
          inputmode="numeric"
          [formField]="form.quantity"
          placeholder="Anzahl">
      </div>

      <div
        class="flex flex-1 items-center border-2 bg-[#ffffff] p-3 rounded-lg focus-within:border-[#697482]"
        [class.border-warning-red]="form.price().invalid() && form.price().touched()"
        [class.border-border-color]="!(form.price().invalid() && form.price().touched())">
        <input
          class="w-full outline-none"
          type="text"
          inputmode="decimal"
          [formField]="form.price"
          placeholder="Preis">
        <span>€</span>
      </div>
    </div>

    <p>{{ form.name().value() }}</p>
    <span></span>

    <button
      type="button"
      class="text-loss-color cursor-pointer w-fit"
      (click)="onDeleteItem(i)">
      Löschen
    </button>
  </div>
}
<div class=" w-[95%]">
    <div class="border-b-2 border-border-color my-2"></div>

    <div class="flex justify-between">
      <div class="font-bold">
        Gesamtbetrag
      </div>
      <!-- @if(totalInvest() && form.quantity().dirty() && form.price().dirty()) { -->
      @if(totalInvest()) {



      <div class="text-2xl font-bold">
      {{totalInvest()}}
      </div>
      }
    </div>

    <div class="border-b-2 border-border-color my-2"></div>



    <div class="flex justify-end gap-3">
      <button type="button" (click)="closeDialog()" class="inline-flex items-center justify-center p-3 rounded-[5px] border-2 border-border-color bg-background-ofwhite text-2xl cursor-pointer hover:brightness-95">
        abbrechen
      </button>
      <button type="submit" [disabled]="addForm().invalid()" class="inline-flex items-center justify-center p-3 rounded-[5px] bg-[#69d9ab] text-2xl cursor-pointer hover:brightness-95">
        hinzufügen
      </button>
    </div>

</div>
   
    </form>


  </div>

</div>
